<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tokn - Desktop Required">
    <title>Tokn - Desktop Required</title>
    <link rel="icon" type="image/png" href="/logo-white.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #252525;
            --border-color: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --accent-blue: #4a90e2;
            --accent-blue-hover: #357abd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            opacity: 1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
            color: var(--accent-blue);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: var(--accent-blue-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>

        <h1>Desktop Required</h1>
        <p>Tokn's visual IDE is optimized for desktop browsers. Please visit on a computer for the full experience.</p>

        <button onclick="history.back()" class="btn-primary">Back to Home</button>
    </div>

    <script>
        // Redirect to IDE if on desktop
        if (window.innerWidth >= 1024) {
            window.location.href = '/app.html';
        }
    </script>
</body>
</html>
